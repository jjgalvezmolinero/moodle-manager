services:
  moodle-manager:
    build: .
    container_name: moodle-manager
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      # Docker socket — necesario para gestionar contenedores
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistencia de instancias configuradas
      - ./data:/data
      # Acceso al sistema de archivos del host para que docker compose resuelva
      # los paths de los volúmenes (wwwroot, moodle-docker) como rutas del host.
      # Ajusta si tus repos están en otro lugar (ej: /opt:/opt o /srv:/srv).
      - /home:/home
      # Monta el código en vivo — los cambios en templates y Python se aplican sin rebuild
      - ./app:/app
    environment:
      - DATA_DIR=/data
      # Ruta de moodle-docker tal y como la ve el daemon Docker del host.
      # En Windows la define start-windows.ps1 en el fichero .env.
      - MOODLE_DOCKER_BUNDLED_PATH=${MOODLE_DOCKER_BUNDLED_PATH:-${PWD}/moodle-docker}
